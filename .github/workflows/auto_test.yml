name: 纯自动化全平台测试

on:
  repository_dispatch:
    types: [orbit_release_published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "手动测试的 Release Tag"
        required: false
        default: "main"
  push:
    branches:
      - main

env:
  PYTHONUTF8: 1

jobs:
  automation-test:
    name: 自动化测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      ORBIT_LOG_PATH: ${{ startsWith(matrix.os, 'windows') && 'C:\Orbit\orbit_boot.log' || '/tmp/orbit_boot.log' }}
      RELEASE_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag || 'main' }}
      DEPS_URL: ${{ github.event.client_payload.deps_url }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }} # 用于从私有 HF Dataset 下载测试版 Installer

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: (仅Linux) 开启常驻虚拟显示器
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y scrot xvfb libwebkit2gtk-4.1-dev libgtk-3-dev
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: 准备 Python 审计依赖
        run: pip install psutil requests

      - name: 1. 执行安装脚本
        run: python test-install.py

      - name: 2. 休息 15 秒等待程序稳定
        run: python -c "import time; time.sleep(15)"

      - name: 3. 初始化内网诊断链路
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: (仅Windows) 清理 Tailscale GUI 弹窗
        if: matrix.os == 'windows-latest'
        run: taskkill /f /im tailscale-ipn.exe || exit 0
        shell: cmd

      - name: 4. 分析测试结果
        run: python analyze-test-result.py

  finalize-verification:
    name: 自动化测试收尾与状态同步
    needs: automation-test
    runs-on: ubuntu-latest
    steps:
      - name: 连接内网诊断链路
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: 触发资产状态同步事件
        run: |
          curl "http://100.113.111.18:1337/api/StartAction" \
            --json '{"bindingId": "thumbsup-generate"}'