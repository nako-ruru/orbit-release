name: 纯自动化全平台测试与发布审批

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "测试的 Release Tag"
        required: true
        default: "main"
      release_id:
        description: "Repo A 的 Release ID"
        required: false
      commit_sha:
        description: "Repo A 构建的 Commit SHA"
        required: false
      source_repo:
        description: "Repo A 的仓库名 (例如 nako-ruru/orbit)"
        required: false
        default: "nako-ruru/orbit"
      draft_flag:
        description: "是否保持 Draft 状态"
        required: false
        default: "true"
      prerelease_flag:
        description: "是否标记为 Pre-release"
        required: false
        default: "false"
      deps_url:
        description: "Dependencies URL"
        required: false
        default: ""
      run_ubuntu:
        description: "测试 Ubuntu?"
        type: boolean
        default: true
      run_windows:
        description: "测试 Windows?"
        type: boolean
        default: false
      run_macos_x86:
        description: "测试 macOS x86?"
        type: boolean
        default: false
      run_macos_arm:
        description: "测试 macOS ARM?"
        type: boolean
        default: false

env:
  PYTHONUTF8: 1

jobs:
  initializer:
    name: 初始化测试矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_jobs: ${{ steps.set-matrix.outputs.has_jobs }}
    steps:
      - id: set-matrix
        run: |
          OS_LIST=()
          if [ "${{ inputs.run_ubuntu }}" == "true" ]; then OS_LIST+=("\"ubuntu-latest\""); fi
          if [ "${{ inputs.run_windows }}" == "true" ]; then OS_LIST+=("\"windows-latest\""); fi
          if [ "${{ inputs.run_macos_x86 }}" == "true" ]; then OS_LIST+=("\"macos-13\""); fi
          if [ "${{ inputs.run_macos_arm }}" == "true" ]; then OS_LIST+=("\"macos-14\""); fi

          if [ ${#OS_LIST[@]} -eq 0 ]; then
            echo "has_jobs=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            JSON_ARRAY="[$(IFS=,; echo "${OS_LIST[*]}")]"
            echo "has_jobs=true" >> $GITHUB_OUTPUT
            echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
          fi

  automation-test:
    needs: initializer
    if: needs.initializer.outputs.has_jobs == 'true'
    name: 自动化测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      ORBIT_LOG_PATH: ${{ startsWith(matrix.os, 'windows') && 'C:\Orbit\orbit_boot.log' || '/tmp/orbit_boot.log' }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      DEPS_URL: ${{ inputs.deps_url }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.initializer.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: (仅Linux) 开启常驻虚拟显示器
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y scrot xvfb libwebkit2gtk-4.1-dev libgtk-3-dev
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: 准备 Python 审计依赖
        run: pip install psutil requests

      - name: 1. 执行安装脚本
        run: python test-install.py

      - name: 2. 休息 15 秒等待程序稳定
        run: python -c "import time; time.sleep(15)"

      - name: 3. 初始化内网诊断链路
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: (仅Windows) 清理 Tailscale GUI 弹窗
        if: matrix.os == 'windows-latest'
        run: taskkill /f /im tailscale-ipn.exe || exit 0
        shell: cmd

      - name: 4. 分析测试结果
        run: python analyze-test-result.py
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  # ====================================================
  # 关键步骤 4: 测试收尾与状态同步 (收集上报测试结果)
  # ====================================================
  finalize-verification:
    needs: [initializer, automation-test]
    if: always() && needs.initializer.outputs.has_jobs == 'true'
    name: 收集上报测试结果 & 状态同步
    runs-on: ubuntu-latest
    steps:
      - name: 连接内网诊断链路
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: 触发资产状态同步事件 (发送诊断数据至 100.113.111.18)
        run: |
          curl "http://100.113.111.18:1337/api/StartAction" \
            --json '{"bindingId": "thumbsup-generate"}'

  # ====================================================
  # 审核通过后处理: 在 Repo A 打 Tag & 激活 Release
  # ====================================================
  publish-release:
    needs: [finalize-verification]
    if: needs.finalize-verification.result == 'success'
    name: 🎉 自动化测试通过：在 Repo A 打 Tag 并发布
    runs-on: ubuntu-latest
    steps:
      - name: 执行打 Tag 和激活 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MY_PAT_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          TAG: ${{ inputs.release_tag }}
          REL_ID: ${{ inputs.release_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          DRAFT: ${{ inputs.draft_flag }}
          PRERELEASE: ${{ inputs.prerelease_flag }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ 错误: Secrets 中未定义 MY_PAT_TOKEN 或 Token 为空！"
            exit 1
          fi

          if [ -n "$COMMIT_SHA" ] && [ -n "$TAG" ]; then
            echo "🏷️ 正在给 $SOURCE_REPO 的 Commit $COMMIT_SHA 打 Tag: $TAG ..."
            # 加了 -f 参数，API 报错时直接中断脚本
            curl -sf -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$SOURCE_REPO/git/refs" \
              -d "{\"ref\": \"refs/tags/$TAG\", \"sha\": \"$COMMIT_SHA\"}"
          fi

          if [ -n "$REL_ID" ]; then
            echo "🚀 正在更新 Repo A 的 Release 状态 (draft=$DRAFT, prerelease=$PRERELEASE)..."
            # 加了 -f 参数
            curl -sf -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$SOURCE_REPO/releases/$REL_ID" \
              -d "{\"draft\": $DRAFT, \"prerelease\": $PRERELEASE}"
          fi
          echo "✅ 全部发布逻辑成功落地！"

  # ====================================================
  # 测试失败/驳回后处理: 自动清理 Repo A 上的 Draft Release
  # ====================================================
  reject-cleanup:
    needs: [automation-test]
    if: failure()
    name: 🗑️ 测试失败/驳回：删除 Repo A 的 Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: 彻底删除 Repo A Draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MY_PAT_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          REL_ID: ${{ inputs.release_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ 错误: Secrets 中未定义 MY_PAT_TOKEN 或 Token 为空！"
            exit 1
          fi

          if [ -n "$REL_ID" ]; then
            echo "🗑️ 自动化测试未通过，删掉 Repo A 的 Draft Release (ID: $REL_ID)..."
            curl -sf -X DELETE \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$SOURCE_REPO/releases/$REL_ID"
            echo "✅ 废弃草稿清理完毕！"
          fi