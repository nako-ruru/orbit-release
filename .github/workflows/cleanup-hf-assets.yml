name: 每月定时清理 HF 过期资产

on:
  schedule:
    # UTC 时间每月 1 号 00:00 自动执行 (北京时间 08:00)
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      hours:
        description: "清理多少小时前的文件 (默认 720 小时/30天)"
        required: false
        default: "720"

jobs:
  cleanup:
    name: 清理 Hugging Face 过期 Releases
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: 执行清理脚本
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          HOURS="${{ inputs.hours || '720' }}"
          python cleanup_hf.py --hours $HOURS